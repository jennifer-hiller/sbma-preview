backend:
  name: github
  repo: jennifer-hiller/sbma-preview
  branch: main # Branch to update (optional; defaults to master)
  site_domain: sbma-preview.netlify.app
media_folder: 'assets/uploads'
collections:
  - name: 'blog'
    label: 'Blog'
    folder: '_posts/'
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    editor:
      preview: false
    fields:
      - { label: 'Layout', name: 'layout', widget: 'hidden', default: 'post' }
      - { label: 'Title', name: 'title', widget: 'string' }
      - { label: 'Publish Date', name: 'date', widget: 'datetime' }
      - { label: 'Body', name: 'body', widget: 'markdown' }
  - name: 'events'
    label: 'Concerts'
    folder: '_events/'
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    editor:
      preview: false
    fields:
      - { label: 'Title', name: 'title', widget: 'string' }
      - { label: 'Concert Date', name: 'date', widget: 'datetime' }
      - { label: 'Time', name: 'time', widget: 'string' }
      - label: 'Ensemble'
        name: 'ensemble'
        widget: 'select'
        options:
          - 'Beach City Swing Band'
          - 'El Segundo Brass Ensemble'
          - 'Segundo Saxes'
          - 'South Bay Concert Band'
          - 'West Coast Wind Symphony'
      - { label: 'Address', name: 'address', widget: 'string' }
      - { label: 'Summary', name: 'description', widget: 'text' }
      - { label: 'Ticket URL', name: 'ticket_url', widget: 'string', required: false }
      - { label: 'Publish', name: 'published', widget: 'boolean', default: true }
